name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: msi,nsis
          - platform: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (cached)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "hoi4-radio-maker v__VERSION__"
          releaseBody: |
            ## hoi4-radio-maker v__VERSION__

            HOI4 音乐/电台 Mod 制作桌面工具（Tauri 2 + Vue 3）。

            ### 功能
            - 项目管理：创建/编辑/删除，默认目录/作者/版本/标签预填，HOI4 版本自动探测
            - 全局音频库：批量导入（mp3/flac/wav/ogg/m4a/aac/wma），BLAKE3 去重，自动转码 Ogg Vorbis 44.1kHz 立体声
            - 电台编辑：多电台、播放权重与触发条件（tag/has_war/has_government/is_in_faction）、排序
            - 一键生成完整 Mod 目录（descriptor.mod、.asset/.txt、简体中文本地化）并验证输出
            - 明暗主题切换

            ### 系统要求
            - 需安装 ffmpeg / ffprobe（首次启动自动探测，可在设置中手动指定）
            - Windows / macOS 安装包与 Linux deb/AppImage 见下方资产

            ### 安装
            下载对应平台安装包即可。Linux 用户若 AppImage 无法运行，请安装 libfuse2。
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
